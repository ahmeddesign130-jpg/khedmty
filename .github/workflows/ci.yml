name: Khedmty CI
# CI validates the rebuild branch before any changes reach main.

on:
  push:
    branches:
      - main
      - "rebuild/**"
      - "fix/**"
      - "audit/**"
      - "feature/**"
  pull_request:
    branches: ["main"]

concurrency:
  group: khedmty-ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  validate:
    runs-on: ubuntu-latest
    env:
      DATABASE_URL: postgresql://postgres:postgres@localhost:5432/khedmty?schema=public
      AUTH_SECRET: ci-only-secret-value-with-at-least-thirty-two-characters
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: npm install
      - run: npx prisma generate
      - run: npm run lint
      - run: npm run typecheck
      - run: npm test
      - run: npm run build
