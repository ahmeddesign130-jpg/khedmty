name: Khedmty CI
# CI validates changes against an isolated temporary database.
on:
  push:
    branches:
      - main
      - "rebuild/**"
      - "fix/**"
      - "audit/**"
      - "feature/**"
  pull_request:
    branches: ["main"]

concurrency:
  group: khedmty-ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  validate:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: khedmty
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres -d khedmty"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
    env:
      DATABASE_URL: postgresql://postgres:postgres@localhost:5432/khedmty?schema=public
      AUTH_SECRET: ci-only-secret-value-with-at-least-thirty-two-characters
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: npm install
      - run: npx prisma generate
      - run: npx prisma db push
      - run: npm run lint
      - run: npm run typecheck
      - run: npm test
      - run: npm run build
